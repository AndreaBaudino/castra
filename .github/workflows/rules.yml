name: Firestore rules

# The rules are the only protection of the data: when they (or their test) change, scripts/test-rules.mjs checks
# them on the Firestore emulator and, on main, the rules that passed are published to Firebase. The emulator's tools
# are installed here only, so the app's dependencies and its deploy stay as they are. Publishing needs the
# FIREBASE_SERVICE_ACCOUNT secret: how to create it is in the README ("Regole di Firestore").

on:
  push:
    paths: [firestore.rules, scripts/test-rules.mjs, .github/workflows/rules.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i --no-save firebase-tools@13 @firebase/rules-unit-testing@4
      - run: npx firebase emulators:exec --only firestore --project demo-castra 'node scripts/test-rules.mjs'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # one publish at a time, the latest wins
    concurrency: firestore-rules
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT: le regole non sono state pubblicate. Vedi il README, \"Regole di Firestore\"."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes firebase-tools@13 deploy --only firestore:rules --project castra-a69ab --non-interactive
