name: Update meta

# Every night at midnight, Italian time: downloads the tournament sheets, rebuilds public/meta-<year>.json
# and, if anything changed, commits it and deploys the app again.
# Cron runs in UTC, so both 22:00 and 23:00 are scheduled and only the one that is midnight in Rome
# goes on (22:00 with summer time, 23:00 without).

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Midnight in Rome?
        id: when
        run: |
          case "$(TZ=Europe/Rome date +%z)" in +0200) midnight='0 22 * * *' ;; *) midnight='0 23 * * *' ;; esac
          if [ "${{ github.event_name }}" != schedule ] || [ "${{ github.event.schedule }}" = "$midnight" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.when.outputs.go
        uses: actions/checkout@v4
      - if: steps.when.outputs.go
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.when.outputs.go
        run: npm ci
      - name: Download the sheets
        if: steps.when.outputs.go
        run: node scripts/fetch-meta.mjs
        env:
          META_SCRIPT_URL: ${{ secrets.META_SCRIPT_URL }}
          META_SCRIPT_KEY: ${{ secrets.META_SCRIPT_KEY }}
      - name: Build the meta
        if: steps.when.outputs.go
        run: npm run meta
      - name: Commit and deploy
        if: steps.when.outputs.go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/meta-*.json scripts/meta/cards.json
          if git diff --cached --quiet; then
            echo "Nessuna novità nei fogli"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Meta: aggiornamento dai fogli dei tornei"
          git push
          # a push made with the workflow's token doesn't start other workflows: deploy explicitly
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
