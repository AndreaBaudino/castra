name: Deploy to GitHub Pages

# Every push runs the tests, but the app is published once a night (only if it changed), so users don't get a new
# version after each commit. Publish now: "[subito]" in a commit message, or "Run workflow" on GitHub. A push that
# changes firestore.rules publishes now too: rules.yml puts the rules online within minutes, and new rules may need
# the app that goes with them.
on:
  push:
    branches: [main]
  # Dependabot's pull requests: checks only, never published
  pull_request:
    branches: [main]
  schedule:
    # 4:00 in Italy: one cron for summer time, one for winter time (the job keeps only the right one)
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.go.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: go
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MSG: ${{ join(github.event.commits.*.message, ' ') }}
          BEFORE: ${{ github.event.before }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          go=false
          case "$EVENT" in
            workflow_dispatch) go=true ;;
            push) { [[ "$MSG" == *'[subito]'* ]] || ! git diff --quiet "$BEFORE" HEAD -- firestore.rules; } && go=true ;;
            schedule)
              if [ "$(TZ=Europe/Rome date +%z)" = '+0200' ]; then want='0 2 * * *'; else want='0 3 * * *'; fi
              if [ "$SCHEDULE" = "$want" ]; then
                # only if something that ends up in the app changed since the last publish
                last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // empty')
                if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null ||
                  ! git diff --quiet "$last" HEAD -- src public index.html vite.config.ts package.json package-lock.json; then
                  go=true
                fi
              fi ;;
          esac
          echo "deploy=$go" | tee -a "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' || steps.go.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: github.event_name != 'schedule' || steps.go.outputs.deploy == 'true'
        run: npm ci
      - if: github.event_name != 'schedule' || steps.go.outputs.deploy == 'true'
        run: npm test
      # type check, lint and build on every push and pull request: with nightly publishing a break would show at 4:00
      - if: github.event_name != 'schedule' || steps.go.outputs.deploy == 'true'
        run: npm run lint
      - if: github.event_name != 'schedule' || steps.go.outputs.deploy == 'true'
        run: npm run build
        env:
          BASE: / # the app is served at the root of its own domain (castra.centurioncommander.app)
      - if: steps.go.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    # one publish at a time; test-only runs no longer cancel a publish in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
